<svg width="800" height="320" viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&amp;display=swap');
      .proj-font { font-family: 'Fira Code', monospace; }
      .card-link { cursor: pointer; }
      .card-link:hover rect { stroke: #1a73e8; stroke-width: 2px; }
    </style>

    <!-- Card Shadow -->
    <filter id="proj-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1a73e8" flood-opacity="0.10"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#202124" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Section Header -->
  <text x="400" y="30" class="proj-font" font-size="14" font-weight="700" fill="#1a73e8" text-anchor="middle" letter-spacing="1.5">FEATURED PRODUCTIONS // RECENT SHIPMENTS</text>

  <!-- ================= CARD 1: VORTEX ================= -->
  <a href="https://vortex-blogs-1-esum.vercel.app/" target="_blank" class="card-link">
    <g transform="translate(30, 55)" filter="url(#proj-shadow)">
      <!-- Background Card -->
      <rect width="230" height="230" rx="12" fill="#ffffff" stroke="#dadce0" stroke-width="1.2"/>
      <!-- Top Accent Bar -->
      <rect width="230" height="6" rx="3" fill="#34a853"/>
      
      <!-- Content Inside Card 1 -->
      <g transform="translate(20, 25)" class="proj-font">
        <text x="0" y="15" font-size="10" font-weight="700" fill="#34a853">SYS-01 // JOURNAL</text>
        <text x="0" y="45" font-size="22" font-weight="700" fill="#202124">Vortex</text>
        
        <!-- Description -->
        <text x="0" y="75" font-size="11" font-weight="500" fill="#5f6368">
          <tspan x="0" dy="0">CEO Journal Blog site</tspan>
          <tspan x="0" dy="16">built for tracking startup</tspan>
          <tspan x="0" dy="16">milestones &amp; updates.</tspan>
        </text>

        <!-- Tech Tag Pill -->
        <rect x="0" y="135" width="85" height="20" rx="6" fill="#e8f0fe"/>
        <text x="42" y="149" font-size="9" font-weight="600" fill="#1a73e8" text-anchor="middle">React / Node</text>
      </g>
    </g>
  </a>

  <!-- ================= CARD 2: NOIR ================= -->
  <a href="https://noir-estates-1.vercel.app/" target="_blank" class="card-link">
    <g transform="translate(285, 55)" filter="url(#proj-shadow)">
      <!-- Background Card -->
      <rect width="230" height="230" rx="12" fill="#ffffff" stroke="#dadce0" stroke-width="1.2"/>
      <!-- Top Accent Bar -->
      <rect width="230" height="6" rx="3" fill="#1a73e8"/>
      
      <!-- Content Inside Card 2 -->
      <g transform="translate(20, 25)" class="proj-font">
        <text x="0" y="15" font-size="10" font-weight="700" fill="#1a73e8">SYS-02 // REAL ESTATE</text>
        <text x="0" y="45" font-size="22" font-weight="700" fill="#202124">Noir</text>
        
        <!-- Description -->
        <text x="0" y="75" font-size="11" font-weight="500" fill="#5f6368">
          <tspan x="0" dy="0">Real Estate listings web</tspan>
          <tspan x="0" dy="16">application showcasing</tspan>
          <tspan x="0" dy="16">luxury properties.</tspan>
        </text>

        <!-- Tech Tag Pill -->
        <rect x="0" y="135" width="85" height="20" rx="6" fill="#e6f4ea"/>
        <text x="42" y="149" font-size="9" font-weight="600" fill="#137333" text-anchor="middle">Vite / Strapi</text>
      </g>
    </g>
  </a>

  <!-- ================= CARD 3: NOVA ================= -->
  <a href="https://nova-1-wslo.vercel.app/" target="_blank" class="card-link">
    <g transform="translate(540, 55)" filter="url(#proj-shadow)">
      <!-- Background Card -->
      <rect width="230" height="230" rx="12" fill="#ffffff" stroke="#dadce0" stroke-width="1.2"/>
      <!-- Top Accent Bar -->
      <rect width="230" height="6" rx="3" fill="#fbbc05"/>
      
      <!-- Content Inside Card 3 -->
      <g transform="translate(20, 25)" class="proj-font">
        <text x="0" y="15" font-size="10" font-weight="700" fill="#f29900">SYS-03 // E-COMMERCE</text>
        <text x="0" y="45" font-size="22" font-weight="700" fill="#202124">Nova</text>
        
        <!-- Description -->
        <text x="0" y="75" font-size="11" font-weight="500" fill="#5f6368">
          <tspan x="0" dy="0">E-commerce store web</tspan>
          <tspan x="0" dy="16">application designed for</tspan>
          <tspan x="0" dy="16">selling tech products.</tspan>
        </text>

        <!-- Tech Tag Pill -->
        <rect x="0" y="135" width="95" height="20" rx="6" fill="#fef7e0"/>
        <text x="47" y="149" font-size="9" font-weight="600" fill="#b06000" text-anchor="middle">Medusa / Stripe</text>
      </g>
    </g>
  </a>
</svg>
