<svg width="800" height="260" viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Import Fira Code Font -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&amp;display=swap');
      .term-font { font-family: 'Fira Code', monospace; }
    </style>

    <!-- Clean Google Light Theme Terminal Background -->
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f9fa"/>
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="term-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1a73e8" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#202124" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Terminal Window Container -->
  <rect width="800" height="260" rx="12" fill="url(#term-bg)" filter="url(#term-shadow)" stroke="#dadce0" stroke-width="1.2"/>

  <!-- Window Title Bar -->
  <rect x="0" y="0" width="800" height="36" rx="12" fill="#f1f3f4"/>
  <rect x="0" y="24" width="800" height="12" fill="#f1f3f4"/>

  <!-- Traffic Lights -->
  <circle cx="24" cy="18" r="6" fill="#ea4335"/>
  <circle cx="44" cy="18" r="6" fill="#fbbc05"/>
  <circle cx="64" cy="18" r="6" fill="#34a853"/>

  <!-- Terminal Title -->
  <text x="400" y="23" class="term-font" fill="#5f6368" font-size="12" font-weight="600" text-anchor="middle">titus@fullstack-core:~ -- tech-stack-query</text>

  <!-- Terminal Log & Stack Content -->
  <g transform="translate(25, 58)" class="term-font" font-size="12">
    <!-- Line 1 -->
    <text y="0">
      <tspan fill="#9aa0a6">[10:17:00]</tspan> 
      <tspan fill="#1a73e8" font-weight="650"> INIT:</tspan> 
      <tspan fill="#202124"> Loading developer profile -> Titus Oluoch</tspan>
    </text>

    <!-- Line 2: Languages -->
    <text y="24">
      <tspan fill="#9aa0a6">[10:17:01]</tspan> 
      <tspan fill="#34a853" font-weight="650"> LANGUAGES:</tspan> 
      <tspan fill="#5f6368"> TS, Lua, Python, JS, HTML, CSS, SCSS</tspan>
    </text>

    <!-- Line 3: Frameworks -->
    <text y="48">
      <tspan fill="#9aa0a6">[10:17:02]</tspan> 
      <tspan fill="#fbbc05" font-weight="650"> FRAMEWORKS:</tspan> 
      <tspan fill="#5f6368"> React, Vue, Next.js, Express, Flask, Medusa, Tailwind</tspan>
    </text>

    <!-- Line 4: Databases -->
    <text y="72">
      <tspan fill="#9aa0a6">[10:17:03]</tspan> 
      <tspan fill="#ea4335" font-weight="650"> DATABASES:</tspan> 
      <tspan fill="#5f6368"> PostgreSQL, MongoDB, Supabase, Redis, Prisma</tspan>
    </text>

    <!-- Line 5: Tools & Infra -->
    <text y="96">
      <tspan fill="#9aa0a6">[10:17:04]</tspan> 
      <tspan fill="#1a73e8" font-weight="650"> TOOLS &amp; ENV:</tspan> 
      <tspan fill="#5f6368"> VSCode, Docker, Vite, Vercel, Strapi, Turborepo</tspan>
    </text>

    <!-- Interactive Active Prompt Line -->
    <g transform="translate(0, 132)">
      <text y="0">
        <tspan fill="#1a73e8" font-weight="700">titus@core:~$</tspan> 
        <tspan fill="#202124" font-weight="500"> ./deploy-ecosystem.sh --status=online</tspan>
        <!-- Blinking Cursor -->
        <rect x="335" y="-10" width="8" height="14" fill="#1a73e8">
          <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
        </rect>
      </text>
    </g>
  </g>
</svg>
