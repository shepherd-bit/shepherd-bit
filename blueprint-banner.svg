<svg width="840" height="240" viewBox="0 0 840 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&amp;display=swap');
      .circuit-font { font-family: 'Fira Code', monospace; }
    </style>

    <linearGradient id="circuit-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f9fa"/>
    </linearGradient>

    <!-- Card Shadow (matching projects.svg) -->
    <filter id="proj-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1a73e8" flood-opacity="0.10"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#202124" flood-opacity="0.05"/>
    </filter>
    
    <!-- ULTRA-HEAVY SHADOW FILTER 2: Icon Group Shadow -->
    <!-- New filter specifically for the blue chip component to make it float over the card -->
    <filter id="icon-float-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1a73e8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Main Card with Soft Shadow (matching projects.svg) -->
  <g transform="translate(20, 20)">
    <!-- Shadow layer (behind card) -->
    <rect width="800" height="200" rx="0" fill="#1a73e8" filter="url(#proj-shadow)" opacity="0.1"/>
    <!-- Card (clean, no filter) -->
    <rect width="800" height="200" rx="0" fill="url(#circuit-bg)" stroke="#dadce0" stroke-width="1.2"/>

    <!-- Blueprint Grid Lines (Subtle) -->
    <g stroke="#1a73e8" stroke-width="0.75" opacity="0.3" fill="none">
      <path d="M 50 20 L 50 180"/>
      <path d="M 750 20 L 750 180"/>
      <line x1="20" y1="50" x2="780" y2="50" stroke-dasharray="4 4"/>
      <line x1="20" y1="150" x2="780" y2="150" stroke-dasharray="4 4"/>
    </g>

    <!-- Icon Group (Component) with Ultra-Floating Shadow applied -->
    <g transform="translate(40, 35)" filter="url(#icon-float-shadow)">
      <rect x="0" y="0" width="130" height="130" rx="0" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
      <rect x="25" y="25" width="80" height="80" rx="6" fill="#ffffff" stroke="#34a853" stroke-width="1.5" stroke-dasharray="3 2"/>
      <circle cx="65" cy="65" r="16" fill="#1a73e8"/>
      <circle cx="65" cy="65" r="6" fill="#fbbc05"/>

      <!-- Circuit Traces -->
      <g stroke="#1a73e8" stroke-width="2" stroke-linecap="round" fill="none">
        <path d="M -15 35 L 0 35"/>
        <path d="M -15 65 L 0 65"/>
        <path d="M -15 95 L 0 95"/>
        <path d="M 130 35 L 145 35"/>
        <path d="M 130 65 L 160 65 L 180 40"/>
        <path d="M 130 95 L 145 95"/>
      </g>
      <!-- Connection Pins -->
      <circle cx="-15" cy="35" r="3" fill="#34a853"/>
      <circle cx="-15" cy="65" r="3" fill="#ea4335"/>
      <circle cx="-15" cy="95" r="3" fill="#fbbc05"/>
      <circle cx="145" cy="35" r="3" fill="#1a73e8"/>
      <circle cx="180" cy="40" r="3" fill="#34a853"/>
      <circle cx="145" cy="95" r="3" fill="#fbbc05"/>
    </g>

    <!-- Text Group (Unchanged) -->
    <g transform="translate(260, 28)">
      <text x="0" y="20" class="circuit-font" fill="#5f6368" font-size="11" font-weight="700" letter-spacing="1.5">HW-SPEC // REV-2.0 CORE ARCHITECTURE</text>
      <text x="0" y="65" class="circuit-font" fill="#202124" font-size="30" font-weight="700" letter-spacing="-0.5">Titus Oluoch</text>
      <text x="0" y="96" class="circuit-font" fill="#1a73e8" font-size="15" font-weight="600">Full-Stack Web Developer</text>

      <!-- Status Line (Unchanged) -->
      <g transform="translate(0, 126)">
        <line x1="0" y1="0" x2="480" y2="0" stroke="#e8eaed" stroke-width="1"/>
        <text x="0" y="22" class="circuit-font" font-size="12" fill="#5f6368">
          <tspan fill="#34a853" font-weight="bold">● STATUS:</tspan> ONLINE &#160;&#160;&#160;
          <tspan fill="#4285f4" font-weight="bold">● STACK:</tspan> TS / NODE / PG &#160;&#160;&#160;
          <tspan fill="#fbbc05" font-weight="bold">● SYS:</tspan> READY
        </text>
      </g>
    </g>
  </g>
</svg>
